schema_version: 1
contract_bindings:
  - contract_id: awr-v1
    version: "1.3.0"
    path: contracts/awr-v1.json
    section: personal
  - contract_id: awr-team-v1
    version: "1.0.0"
    path: contracts/awr-team-v1.json
    section: team_work
  - contract_id: awr-team-acceptance-v1
    version: "1.0.0"
    path: contracts/awr-team-acceptance-v1.json
    section: team_acceptance
personal:
  work_items:
    - id: AWR-BOOT-001
      title: prep
      milestone: M0
      priority: P0
      status: completed
      depends_on: []
      deliverables: [README.md]
      acceptance: ["repo public"]
      source_sections: [0]
      next_action: done
      required_for_v1: false
      verification: {evidence_level: L2}
      evidence: [ledger/evidence/boot.json]
      acceptance_results:
        - criterion: repo public
          passed: true
    - id: AWR-P0-001
      title: core
      milestone: M1
      priority: P0
      status: planned
      depends_on: [AWR-BOOT-001]
      deliverables: [crates/awr-core]
      acceptance: ["types exist"]
      source_sections: [1]
      next_action: implement
      required_for_v1: true
      verification: {evidence_level: L1}
team_work:
  work_definitions:
    - work_id: TW-001
      external_key: team-work-1
      acceptance: ["scope published"]
      completion_policy: receipt_required
      scope_paths: ["crates/awr-team/"]
      status: completed
      completion_receipt:
        receipt_id: rcpt-tw-001
        verified: true
team_acceptance:
  acceptance_scenarios:
    - id: TAS-001
      title: team claim handoff
      status: completed
      required_gates: [claim, handoff, review]
      gates: {claim: true, handoff: true, review: true}
      executor: agent-a
      reviewer: agent-b
      evidence: [ledger/evidence/tas-001.json]
